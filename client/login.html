<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Sign In — GenZ Shopping</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/toast.css" />
</head>
<body style="background: linear-gradient(135deg, #f8fafc 0%, #eef2ff 100%);">

  <!-- Simple Header -->
  <header style="padding: 24px 0;">
    <div class="container" style="display: flex; justify-content: space-between; align-items: center;">
      <a href="/index.html" class="brand-logo">
        <div class="brand-icon">🔥</div>
        <div class="brand-text">GenZ <span>Shopping</span></div>
      </a>
      <a href="/index.html" class="nav-link">← Back to Drops</a>
    </div>
  </header>

  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-icon">👋</div>
        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">Sign in to check your trending cart & track delivery</p>
      </div>

      <!-- Quick Demo Account helper -->
      <div class="demo-credentials-box">
        <div style="font-weight: 700; color: #0f172a; margin-bottom: 2px;">Testing Account (Pre-filled Trending Cart):</div>
        <div>Email: <strong>user@eshop.com</strong> | Pass: <strong>user123</strong></div>
        <button type="button" class="demo-btn-fill" onclick="fillDemoCustomer()">
          ⚡ Auto-fill Customer Credentials
        </button>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="loginEmail">Email Address *</label>
          <input 
            type="email" 
            id="loginEmail" 
            class="form-input" 
            placeholder="name@example.com" 
            required 
            autocomplete="email"
          />
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
            <label class="form-label" for="loginPassword" style="margin-bottom: 0;">Password *</label>
            <a href="#" onclick="showToast('For demo, use user123 or reset via database', 'info')" style="font-size: 0.8rem; color: #4f46e5; font-weight: 600;">Forgot?</a>
          </div>
          <input 
            type="password" 
            id="loginPassword" 
            class="form-input" 
            placeholder="Enter your password" 
            required 
            autocomplete="current-password"
          />
        </div>

        <button type="submit" id="btnLoginSubmit" class="btn-auth btn-primary" style="width: 100%; justify-content: center; padding: 14px; font-size: 1rem; margin-top: 10px;">
          Sign In to GenZ Shopping
        </button>
      </form>

      <div style="text-align: center; margin-top: 24px; font-size: 0.9rem; color: #64748b;">
        Don't have an account yet? 
        <a href="/register.html" style="color: #4f46e5; font-weight: 700;">Create an Account</a>
      </div>

      <div style="text-align: center; margin-top: 16px; padding-top: 16px; border-top: 1px solid #f1f5f9; font-size: 0.85rem;">
        Are you a store administrator? 
        <a href="/admin-login.html" style="color: #0f172a; font-weight: 700;">Admin Login →</a>
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    function fillDemoCustomer() {
      document.getElementById('loginEmail').value = 'user@eshop.com';
      document.getElementById('loginPassword').value = 'user123';
      showToast('Demo credentials populated!', 'info');
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;

      const btn = document.getElementById('btnLoginSubmit');
      const originalText = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = `<span style="display:inline-block; width:12px; height:12px; border:2px solid #fff; border-top-color:transparent; border-radius:50%; animation:spin 0.6s linear infinite;"></span> Signing In...`;

      try {
        const res = await API.post('/auth/login', { email, password });
        if (res.success && res.token) {
          Auth.setSession(res.user, res.token);
          showToast('Welcome back, ' + res.user.name + '!', 'success');

          const params = new URLSearchParams(window.location.search);
          const redirect = params.get('redirect');

          setTimeout(() => {
            if (redirect) {
              window.location.href = redirect;
            } else if (res.user.role === 'admin') {
              window.location.href = '/admin.html';
            } else {
              window.location.href = '/index.html';
            }
          }, 600);
        }
      } catch (error) {
        showToast(error.message || 'Invalid email or password', 'error', 'Login Failed');
        btn.disabled = false;
        btn.innerHTML = originalText;
      }
    });
  </script>
</body>
</html>
