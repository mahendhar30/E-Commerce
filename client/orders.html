<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="View your order history, track live delivery status, and review order invoices at GenZ Shopping." />
  <title>My Orders — GenZ Shopping</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/toast.css" />
</head>
<body>

  <!-- Sticky Navbar -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="/index.html" class="brand-logo">
        <div class="brand-icon">🔥</div>
        <div class="brand-text">GenZ <span>Shopping</span></div>
      </a>

      <div class="nav-actions" style="margin-left: auto;">
        <a href="/index.html" class="nav-link">← Back to Drops</a>
        <a href="/cart.html" class="cart-btn" id="navCartBtn" title="Shopping Bag">
          <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
          </svg>
          <span class="cart-badge" id="cartBadge" style="display: none;">0</span>
        </a>
        <div id="navAuthActions" style="display: flex; align-items: center; gap: 10px;"></div>
      </div>
    </div>
  </header>

  <main class="container" style="padding-top: 28px;">
    <!-- Breadcrumbs -->
    <nav class="breadcrumb" aria-label="Breadcrumb">
      <a href="/index.html">Home</a>
      <span>/</span>
      <span style="color: #0f172a; font-weight: 600;">My Orders</span>
    </nav>

    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 16px;">
      <div>
        <h1 style="font-size: 1.85rem; font-weight: 800; color: #0f172a;">Order History & Status</h1>
        <p style="color: #64748b; font-size: 0.95rem;">Review past drops, fulfillment status, and delivery addresses.</p>
      </div>
      <a href="/index.html" class="btn-sm btn-outline">
        + Explore More Drops
      </a>
    </div>

    <!-- Orders List Container (Rendered by orders.js) -->
    <div id="ordersListContainer" class="orders-container">
      <div style="text-align: center; padding: 60px 0;">
        <div style="display: inline-block; width: 40px; height: 40px; border: 3px solid #e2e8f0; border-top-color: #4f46e5; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
        <p style="margin-top: 14px; color: #64748b; font-weight: 600;">Retrieving your orders...</p>
      </div>
    </div>
  </main>

  <!-- Site Footer -->
  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom">
        <div>© 2026 GenZ Shopping Inc. All rights reserved. Full-Stack Web Development Major Project.</div>
        <div style="display: flex; gap: 16px;">
          <a href="/index.html">Home</a>
          <a href="/cart.html">Bag</a>
        </div>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/orders.js"></script>
</body>
</html>
