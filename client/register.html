<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create New Account — GenZ Shopping</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/toast.css" />
</head>
<body style="background: linear-gradient(135deg, #f8fafc 0%, #eef2ff 100%);">

  <header style="padding: 24px 0;">
    <div class="container" style="display: flex; justify-content: space-between; align-items: center;">
      <a href="/index.html" class="brand-logo">
        <div class="brand-icon">🔥</div>
        <div class="brand-text">GenZ <span>Shopping</span></div>
      </a>
      <a href="/login.html" class="nav-link">Already Registered? Sign In</a>
    </div>
  </header>

  <main class="auth-wrapper">
    <div class="auth-card wide">
      <div class="auth-header">
        <div class="auth-icon">🚀</div>
        <h1 class="auth-title">Create GenZ Account</h1>
        <p class="auth-subtitle">Join thousands of trendsetters enjoying viral drops with Cash on Delivery</p>
      </div>

      <form id="registerForm">
        <div class="form-row-2">
          <div class="form-group">
            <label class="form-label" for="regName">Full Name *</label>
            <input type="text" id="regName" class="form-input" placeholder="e.g. Aryan Kapoor" required />
          </div>
          <div class="form-group">
            <label class="form-label" for="regPhone">Mobile Number *</label>
            <input type="tel" id="regPhone" class="form-input" placeholder="e.g. 9812345678" required />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="regEmail">Email Address *</label>
          <input type="email" id="regEmail" class="form-input" placeholder="e.g. aryan@example.com" required />
        </div>

        <div class="form-row-2">
          <div class="form-group">
            <label class="form-label" for="regPassword">Password * (Min 6 chars)</label>
            <input type="password" id="regPassword" class="form-input" placeholder="••••••••" required minlength="6" />
          </div>
          <div class="form-group">
            <label class="form-label" for="regConfirmPassword">Confirm Password *</label>
            <input type="password" id="regConfirmPassword" class="form-input" placeholder="••••••••" required minlength="6" />
          </div>
        </div>

        <!-- Default Delivery Address -->
        <div class="form-group">
          <label class="form-label" for="regStreet">Street / Flat Address *</label>
          <input type="text" id="regStreet" class="form-input" placeholder="Apt 14B, Skyline Residency, Bandra West" required />
        </div>

        <div class="form-row-3">
          <div class="form-group">
            <label class="form-label" for="regCity">City *</label>
            <input type="text" id="regCity" class="form-input" placeholder="e.g. Mumbai" required />
          </div>
          <div class="form-group">
            <label class="form-label" for="regState">State *</label>
            <input type="text" id="regState" class="form-input" placeholder="e.g. Maharashtra" required />
          </div>
          <div class="form-group">
            <label class="form-label" for="regPincode">Pincode *</label>
            <input type="text" id="regPincode" class="form-input" placeholder="e.g. 400050" required />
          </div>
        </div>

        <button type="submit" id="btnRegisterSubmit" class="btn-auth btn-primary" style="width: 100%; justify-content: center; padding: 15px; font-size: 1.05rem; margin-top: 10px;">
          Complete Registration
        </button>
      </form>

      <div style="text-align: center; margin-top: 24px; font-size: 0.9rem; color: #64748b;">
        Already have an account? 
        <a href="/login.html" style="color: #4f46e5; font-weight: 700;">Log In</a>
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const name = document.getElementById('regName').value.trim();
      const phone = document.getElementById('regPhone').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;
      const confirmPassword = document.getElementById('regConfirmPassword').value;
      const street = document.getElementById('regStreet').value.trim();
      const city = document.getElementById('regCity').value.trim();
      const state = document.getElementById('regState').value.trim();
      const pincode = document.getElementById('regPincode').value.trim();

      if (password !== confirmPassword) {
        showToast('Passwords do not match. Please verify.', 'error', 'Validation Error');
        return;
      }

      if (password.length < 6) {
        showToast('Password must be at least 6 characters long.', 'error', 'Validation Error');
        return;
      }

      const btn = document.getElementById('btnRegisterSubmit');
      const originalText = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = `<span style="display:inline-block; width:12px; height:12px; border:2px solid #fff; border-top-color:transparent; border-radius:50%; animation:spin 0.6s linear infinite;"></span> Creating Account...`;

      try {
        const res = await API.post('/auth/register', {
          name,
          phone,
          email,
          password,
          confirmPassword,
          address: { street, city, state, pincode },
        });

        if (res.success && res.token) {
          Auth.setSession(res.user, res.token);
          showToast(res.message || 'Account created successfully!', 'success', 'Welcome!');

          setTimeout(() => {
            window.location.href = '/index.html';
          }, 600);
        }
      } catch (error) {
        showToast(error.message || 'Registration failed', 'error', 'Error');
        btn.disabled = false;
        btn.innerHTML = originalText;
      }
    });
  </script>
</body>
</html>
